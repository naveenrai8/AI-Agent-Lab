[project]
name = "python-lab"
version = "0.1.0"
description = "Add your description here"
readme = "README.md"
requires-python = ">=3.13"
dependencies = [
    "ipykernel>=7.3.0",
    "langchain>=1.3.18",
    "langchain-groq>=1.1.3",
    "langchain-openai>=1.6.0",
    "logfire[httpx]>=4.41.0",
    "python-dotenv>=1.2.3",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["common"]   # tell hatchling which top-level dir(s) to package